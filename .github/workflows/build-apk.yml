name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the files from the repository
        uses: actions/checkout@v4

      # Step 1+2+3+4: put every part in the right place.
      # Works whether you uploaded the 3 ZIP files OR already extracted them.
      - name: Assemble the project (ZIP parts and/or extracted folders)
        run: |
          shopt -s nullglob
          parts=(LILKESSphoto-part*.zip)
          echo "ZIP parts found in repo: ${#parts[@]}"
          for z in "${parts[@]}"; do echo "Opening $z"; unzip -oq "$z" -d .; done
          # If the parts were extracted into sub-folders, move them to the top.
          if [ ! -f www/index.html ]; then
            found=$(find . -path ./node_modules -prune -o -type f -name index.html -path '*/www/index.html' -print | head -1)
            if [ -n "$found" ]; then
              root=$(dirname "$(dirname "$found")")
              echo "Project found inside: $root - moving it to the top"
              cp -a "$root"/. .
            fi
          fi
          # Store pictures and AI models may sit in their own folders.
          for d in store models; do
            if [ ! -d www/$d ]; then
              f=$(find . -type d -name $d -path "*www*" -not -path "./node_modules/*" | head -1)
              [ -n "$f" ] && mkdir -p www && cp -a "$f" www/ && echo "Placed $d from $f"
            fi
          done
          echo "--- layout ---"
          ls
          echo "store files:  $(ls www/store 2>/dev/null | wc -l)"
          echo "model files:  $(ls www/models 2>/dev/null | wc -l)"

      - name: Check that no file is missing
        run: python3 tools/check_project.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android

      - name: Add icons and Android settings
        run: python3 scripts/apply_android_resources.py

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Keep the APK for download
        uses: actions/upload-artifact@v4
        with:
          name: LILKESSphoto-Pro-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Report a problem (only runs if something failed)
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo "Open the red step above and copy its last lines to Claude."
            echo "Files in repo root: $(ls | tr '\n' ' ')"
            echo "www/store files: $(ls www/store 2>/dev/null | wc -l)"
            echo "www/models files: $(ls www/models 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"
