name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Get the files from the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Opens all 4 ZIP parts (found anywhere in the repo, even if renamed like
      # "part2-store (1).zip") and puts everything in the right place.
      # It does not depend on any other file in the repo, and prints what it sees.
      - name: Open the 4 ZIP parts and assemble the project
        run: |
          python - <<'PY'
          import os, sys, zipfile, shutil, re

          def find_zip(tag):
              hits = []
              for dp, dn, fn in os.walk('.'):
                  dn[:] = [d for d in dn if d not in ('node_modules', '.git', 'release', '_www')]
                  for f in fn:
                      if f.lower().endswith('.zip') and re.search(r'part\s*' + tag, f.lower()):
                          hits.append(os.path.join(dp, f))
              return sorted(hits)

          print('Files at repo top:', sorted(os.listdir('.')))
          bad = False
          for tag, label in (('1', 'app'), ('2', 'store'), ('3', 'models'), ('4', 'windows')):
              hits = find_zip(tag)
              if not hits:
                  print(f'ERROR: no ZIP for part{tag} ({label}) found in the repository.')
                  bad = True
                  continue
              for z in hits:
                  zf = zipfile.ZipFile(z)
                  names = [n for n in zf.namelist() if not n.endswith('/')]
                  print(f'part{tag}: {z}  ({len(names)} files, first: {names[0] if names else "-"})')
                  zf.extractall('.')
          if bad:
              print('Upload the missing ZIP file(s) to the top of the repository and run again.')
              sys.exit(1)

          # Safety: if a part was packed with a different top folder, move things into www/
          def count(d): return len(os.listdir(d)) if os.path.isdir(d) else 0
          for d in ('store', 'models', 'css', 'js', 'img', 'fonts'):
              if not os.path.isdir('www/' + d) and os.path.isdir(d):
                  print('Moving', d, '-> www/' + d)
                  os.makedirs('www', exist_ok=True)
                  shutil.move(d, 'www/' + d)

          print('www/index.html :', os.path.isfile('www/index.html'))
          print('www/store files:', count('www/store'))
          print('www/models files:', count('www/models'))
          print('desktop/main.js:', os.path.isfile('desktop/main.js'))
          ok = (os.path.isfile('www/index.html') and count('www/store') >= 100
                and count('www/models') >= 2 and os.path.isfile('desktop/main.js'))
          if not ok:
              print('ERROR: something is still missing after opening the ZIPs (see numbers above).')
              sys.exit(1)
          print('Project assembled OK')
          PY

      - name: Install Electron and Electron Builder
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build the Windows installer and portable app
        working-directory: desktop
        run: npm run dist

      - name: List what was built
        working-directory: desktop
        run: ls -la release

      - name: Keep the installer for download
        uses: actions/upload-artifact@v4
        with:
          name: LILKESSphoto-Pro-Windows
          path: |
            desktop/release/LILKESSphoto-Pro-Setup.exe
            desktop/release/LILKESSphoto-Pro-Portable.exe
          if-no-files-found: error

      - name: Report a problem (only runs if something failed)
        if: failure()
        run: |
          {
            echo "## Windows build failed"
            echo "Open the red step above and send its last lines to Claude."
            echo "www/store files: $(ls www/store 2>/dev/null | wc -l)  www/models files: $(ls www/models 2>/dev/null | wc -l)"
            echo "(0 here usually means the ZIP step failed first - read that step.)"
          } >> "$GITHUB_STEP_SUMMARY"
          
